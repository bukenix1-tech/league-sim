<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>リーグ運営シム</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/ui/style.css?v=6">
</head>
<body>
  <header>
    <h1>リーグ運営シム <small>段階 5</small></h1>
  </header>
  <main>
    <section id="picker" class="panel" hidden>
      <div class="card">
        <h2>自分のクラブを選ぶ</h2>
        <p class="sub">あなたはクラブの経営者です。試合は監督に任せ、お金と補強の予算を決めます。2 部の小さなクラブから 1 部の優勝を目指すのがおすすめです。</p>
      </div>
      <div class="seg" id="picker-div">
        <button type="button" data-div="0" aria-pressed="false">1 部</button>
        <button type="button" data-div="1" aria-pressed="true">2 部</button>
      </div>
      <ul id="picker-list" class="picker"></ul>
    </section>

    <section id="game-controls" class="controls" hidden>
      <button id="next1" type="button" disabled>1 年進める</button>
      <button id="next10" type="button" class="secondary" disabled>10 年進める</button>
    </section>
    <p id="status" class="status">読み込み中…</p>

    <nav id="tabs" class="tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="office" aria-selected="true">経営</button>
      <button type="button" role="tab" data-tab="market" aria-selected="false">移籍</button>
      <button type="button" role="tab" data-tab="table" aria-selected="false">順位</button>
      <button type="button" role="tab" data-tab="leaders" aria-selected="false">個人</button>
      <button type="button" role="tab" data-tab="club" aria-selected="false">クラブ</button>
      <button type="button" role="tab" data-tab="rounds" aria-selected="false">試合</button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">歴代</button>
    </nav>

    <div id="div-switch" class="seg" hidden>
      <button type="button" data-div="0" aria-pressed="true">1 部</button>
      <button type="button" data-div="1" aria-pressed="false">2 部</button>
    </div>

    <section id="tab-office" class="panel" hidden></section>

    <section id="tab-market" class="panel" hidden></section>

    <section id="tab-table" class="panel" hidden>
      <table id="table">
        <thead>
          <tr><th>#</th><th class="club">クラブ</th><th>試</th><th>勝</th><th>分</th><th>敗</th><th>差</th><th>点</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="table-legend" class="legend"></p>
      <div id="playoff"></div>
    </section>

    <section id="tab-leaders" class="panel" hidden></section>

    <section id="tab-club" class="panel" hidden>
      <label class="select">クラブ <select id="club-select"></select></label>
      <div id="club-info"></div>
      <table id="squad" class="squad">
        <thead>
          <tr><th>位</th><th class="club">選手</th><th>齢</th><th>総合</th><th>試</th><th>得</th><th>通算</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="legend">試・得は前のシーズン、通算は通算の得点。選手を押すと能力が見られます。✚ は前のシーズンにけがをした選手</p>
    </section>

    <section id="tab-rounds" class="panel" hidden>
      <div id="round-list"></div>
    </section>

    <section id="tab-history" class="panel" hidden></section>

    <details class="card save">
      <summary>セーブ・新しく始める</summary>
      <p class="sub">1 年進めるたびと予算を変えたときに、このブラウザの中に自動でセーブします。別の端末に移すときや、念のための控えには「書き出し」を使ってください。</p>
      <div class="row">
        <button id="export" type="button" class="secondary">書き出し</button>
        <label class="file-button secondary">読み込み<input id="import" type="file" accept="application/json,.json"></label>
      </div>
      <div class="row">
        <label class="grow">乱数の種 <input id="seed" type="number" inputmode="numeric" placeholder="空ならおまかせ"></label>
        <button id="new" type="button" class="danger">新しく始める</button>
      </div>
    </details>
  </main>
  <script type="module" src="src/ui/app.js?v=5"></script>
</body>
</html>
