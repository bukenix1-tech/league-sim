<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>リーグ運営シム</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <header>
    <h1>リーグ運営シム <small>段階 2</small></h1>
  </header>
  <main>
    <section class="controls">
      <label>乱数の種
        <input id="seed" type="number" inputmode="numeric" placeholder="空ならおまかせ">
      </label>
      <button id="run" type="button">1 シーズンを回す</button>
    </section>
    <p id="status" class="status">ボタンを押すと、選手と監督を作って 38 節を回します。</p>

    <nav id="tabs" class="tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="table" aria-selected="true">順位</button>
      <button type="button" role="tab" data-tab="leaders" aria-selected="false">個人成績</button>
      <button type="button" role="tab" data-tab="club" aria-selected="false">クラブ</button>
      <button type="button" role="tab" data-tab="rounds" aria-selected="false">試合</button>
    </nav>

    <section id="tab-table" class="panel" hidden>
      <table id="table">
        <thead>
          <tr><th>#</th><th class="club">クラブ</th><th>試</th><th>勝</th><th>分</th><th>敗</th><th>差</th><th>点</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="legend"><span class="swatch champ"></span>優勝 <span class="swatch down"></span>降格圏　クラブ名を押すと選手が見られます</p>
    </section>

    <section id="tab-leaders" class="panel" hidden></section>

    <section id="tab-club" class="panel" hidden>
      <label class="select">クラブ <select id="club-select"></select></label>
      <div id="club-info"></div>
      <table id="squad" class="squad">
        <thead>
          <tr><th>位</th><th class="club">選手</th><th>齢</th><th>総合</th><th>試</th><th>得</th><th>ア</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="legend">選手を押すと能力が見られます。✚ はシーズン中にけがをした選手</p>
    </section>

    <section id="tab-rounds" class="panel" hidden>
      <div id="round-list"></div>
    </section>
  </main>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
