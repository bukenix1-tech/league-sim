<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まとめ</title>
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <main>
    <h1>何シーズンも回したまとめ</h1>
    <section class="controls">
      <label>回数 <input id="runs" type="number" inputmode="numeric" value="1000"></label>
      <label>種 <input id="seed" type="number" inputmode="numeric" value="1"></label>
      <button id="go" type="button">回す</button>
    </section>
    <pre id="out" class="status"></pre>
    <h1>何十年も続けたまとめ</h1>
    <section class="controls">
      <label>年数 <input id="years" type="number" inputmode="numeric" value="50"></label>
      <button id="go-long" type="button">回す</button>
    </section>
    <pre id="out-long" class="status"></pre>
  </main>
  <script type="module">
    import { formatAgingCurve, formatLongRun, formatSummary } from "./src/engine/format.js";
    import { longRun } from "./src/engine/longrun.js";
    import { agingCurve, summarize } from "./src/engine/summary.js";
    import { parseClubData, parseNameData } from "./src/engine/clubs.js";
    const [clubJson, nameJson] = await Promise.all(["data/clubs.json", "data/names.json"].map((u) => fetch(u).then((r) => r.json())));
    const clubData = parseClubData(clubJson);
    const clubs = clubData.divisions[0].clubs;
    const names = parseNameData(nameJson);
    const out = document.getElementById("out");
    document.getElementById("go").addEventListener("click", () => {
      out.textContent = "計算中…";
      setTimeout(() => {
        const runs = Number(document.getElementById("runs").value);
        const seed = Number(document.getElementById("seed").value);
        const t0 = performance.now();
        const s = summarize(clubs, names, runs, seed);
        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        out.textContent = `${formatSummary(s, clubs, seed)}\n\n${formatAgingCurve(agingCurve(seed, 2000, 55))}\n\n(${secs} 秒)`;
      }, 0);
    });
    const outLong = document.getElementById("out-long");
    document.getElementById("go-long").addEventListener("click", () => {
      outLong.textContent = "計算中…";
      setTimeout(() => {
        const years = Number(document.getElementById("years").value);
        const seed = Number(document.getElementById("seed").value);
        const t0 = performance.now();
        const r = longRun(clubData, names, seed, years);
        outLong.textContent = `${formatLongRun(r)}

(${((performance.now() - t0) / 1000).toFixed(1)} 秒)`;
      }, 0);
    });
  </script>
</body>
</html>
